    <script>
      const elements = {
        body: document.body,
        list: document.getElementById("mail-list"),
        count: document.getElementById("mail-count"),
        source: document.getElementById("mail-source"),
        inboxCount: document.getElementById("inbox-count"),
        starredCount: document.getElementById("starred-count"),
        unprocessedCount: document.getElementById("unprocessed-count"),
        processedCount: document.getElementById("processed-count"),
        newCount: document.getElementById("new-count"),
        folderTitle: document.getElementById("folder-title"),
        search: document.getElementById("mail-search"),
        searchClear: document.getElementById("search-clear"),
        importButton: document.getElementById("import-button"),
        composeButton: document.getElementById("compose-button"),
        mobileMenuButton: document.getElementById("mobile-menu-button"),
        mobileBackButton: document.getElementById("mobile-back-button"),
        mobileScrim: document.getElementById("mobile-scrim"),
        readerPosition: document.getElementById("reader-position"),
        readerEmpty: document.getElementById("reader-empty"),
        readerContent: document.getElementById("reader-content"),
        readerScroll: document.getElementById("reader-scroll"),
        messageTitle: document.getElementById("message-title"),
        messageAvatar: document.getElementById("message-avatar"),
        messageSender: document.getElementById("message-sender"),
        messageRecipient: document.getElementById("message-recipient"),
        messageTime: document.getElementById("message-time"),
        mailBody: document.getElementById("mail-body"),
        expandBodyButton: document.getElementById("expand-body-button"),
        attachmentsSection: document.getElementById("attachments-section"),
        attachments: document.getElementById("mail-attachments"),
        attachmentCount: document.getElementById("attachment-count"),
        extractionCard: document.getElementById("extraction-card"),
        extractionStatus: document.getElementById("extraction-status"),
        extractionResult: document.getElementById("extraction-result"),
        refreshExtractionButton: document.getElementById("refresh-extraction-button"),
        processedButton: document.getElementById("processed-button"),
        starButton: document.getElementById("star-button"),
        inlineStarButton: document.getElementById("inline-star-button"),
        replyButton: document.getElementById("reply-button"),
        forwardButton: document.getElementById("forward-button"),
        deleteButton: document.getElementById("delete-button"),
        guideButton: document.getElementById("guide-button"),
        guideDialog: document.getElementById("guide-dialog"),
        guideCloseButton: document.getElementById("guide-close-button"),
        connectionEmail: document.getElementById("connection-email"),
        mailConfigSummary: document.getElementById("mail-config-summary"),
        composeDialog: document.getElementById("compose-dialog"),
        composeDialogTitle: document.getElementById("compose-dialog-title"),
        composeForm: document.getElementById("compose-form"),
        composeTo: document.getElementById("compose-to"),
        composeSubject: document.getElementById("compose-subject"),
        composeText: document.getElementById("compose-text"),
        composeCloseButton: document.getElementById("compose-close-button"),
        composeCancelButton: document.getElementById("compose-cancel-button"),
        sendButton: document.getElementById("send-button"),
        toast: document.getElementById("toast"),
        toastIcon: document.getElementById("toast-icon"),
        toastText: document.getElementById("toast-text")
      };

      const folderTitles = {
        inbox: "收件箱",
        starred: "已标星",
        unprocessed: "未处理邮件",
        processed: "已处理邮件",
        new: "新增邮件"
      };

      const { categoryStyles, categorizeMail } = window.MailCategoryClassifier;
      const labelTitles = Object.fromEntries(
        Object.entries(categoryStyles).map(([id, category]) => [id, category.label])
      );

      const avatarColors = ["#2fa99f", "#4c8ed9", "#8b6bcf", "#d88938", "#d76067", "#3ba77b"];
      const extractionCache = new Map();
      const extractionCacheEnabled = false;
      const starredMailIds = new Set();
      const deletedMailIds = new Set();
      const processedMailIds = new Set(readStoredIds("smart-mail-processed"));
      const newMailIds = new Set(readStoredIds("smart-mail-new"));
      const knownMailIds = new Set(readStoredIds("smart-mail-known"));
      const sentMails = [];
      let mailRecords = [];
      let activeMailId = "";
      let activeFolder = "inbox";
      let activeLabel = "";
      let currentExtractionRequest = 0;
      let toastTimer = 0;
      let bodyExpanded = false;

      function readStoredIds(key) {
        try {
          const value = JSON.parse(window.localStorage.getItem(key) || "[]");
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function persistMailStatus() {
        try {
          window.localStorage.setItem("smart-mail-processed", JSON.stringify([...processedMailIds]));
          window.localStorage.setItem("smart-mail-new", JSON.stringify([...newMailIds]));
          window.localStorage.setItem("smart-mail-known", JSON.stringify([...knownMailIds]));
        } catch {
          // Private browsing or storage restrictions should not block mail handling.
        }
      }

      function reconcileMailStatus() {
        const currentIds = new Set(mailRecords.map((mail) => mail.id));
        if (knownMailIds.size) {
          currentIds.forEach((id) => {
            if (!knownMailIds.has(id)) newMailIds.add(id);
          });
        }
        [processedMailIds, newMailIds].forEach((set) => {
          [...set].forEach((id) => {
            if (!currentIds.has(id)) set.delete(id);
          });
        });
        knownMailIds.clear();
        currentIds.forEach((id) => knownMailIds.add(id));
        persistMailStatus();
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      const toastIcons = {
        info: '<circle cx="12" cy="12" r="9"></circle><path d="M12 10.5V16M12 7.5h.01"></path>',
        success: '<circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16.5 9"></path>',
        warning: '<path d="M10.3 4.2 2.8 17.5A2 2 0 0 0 4.6 20h14.8a2 2 0 0 0 1.8-2.5L13.7 4.2a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4M12 16.5h.01"></path>',
        error: '<circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6M15 9l-6 6"></path>'
      };

      function showToast(message, tone = "info") {
        const normalizedTone = Object.hasOwn(toastIcons, tone) ? tone : "info";
        const normalizedMessage = String(message || "操作状态已更新");
        window.clearTimeout(toastTimer);
        elements.toastText.textContent = normalizedMessage;
        elements.toastIcon.innerHTML = toastIcons[normalizedTone];
        elements.toast.className = `toast ${normalizedTone}`;
        elements.toast.setAttribute("role", normalizedTone === "error" ? "alert" : "status");
        elements.toast.setAttribute("aria-live", normalizedTone === "error" ? "assertive" : "polite");
        window.requestAnimationFrame(() => elements.toast.classList.add("visible"));
        const displayDuration = Math.min(7000, Math.max(3600, normalizedMessage.length * 90));
        toastTimer = window.setTimeout(() => {
          elements.toast.classList.remove("visible");
        }, displayDuration);
      }

      function showDialog(dialog) {
        if (typeof dialog.showModal === "function") {
          dialog.showModal();
        } else {
          dialog.setAttribute("open", "");
        }
      }

      function closeDialog(dialog) {
        if (typeof dialog.close === "function") {
          dialog.close();
        } else {
          dialog.removeAttribute("open");
        }
      }

      function getActiveMail() {
        return [...mailRecords, ...sentMails].find((mail) => mail.id === activeMailId) || null;
      }

      function getEmailAddress(value) {
        const text = String(value || "");
        const bracketMatch = text.match(/<([^>]+)>/);
        if (bracketMatch) {
          return bracketMatch[1];
        }
        const emailMatch = text.match(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/);
        return emailMatch ? emailMatch[0] : text;
      }

      function getDisplayName(value) {
        const text = String(value || "未知发件人").trim();
        const beforeBracket = text.split("<")[0].trim();
        if (beforeBracket) {
          return beforeBracket.replace(/^"|"$/g, "");
        }
        return getEmailAddress(text) || "未知发件人";
      }

      function getInitial(value) {
        const name = getDisplayName(value).trim();
        const first = Array.from(name)[0] || "邮";
        return /[a-z]/i.test(first) ? first.toUpperCase() : first;
      }

      function getAvatarColor(value) {
        const text = String(value || "mail");
        const hash = Array.from(text).reduce((sum, char) => sum + char.codePointAt(0), 0);
        return avatarColors[hash % avatarColors.length];
      }

      function formatDisplayTime(value) {
        if (!value) return "未知时间";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(date).replace(/\//g, "-");
      }

      function formatListTime(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        const now = new Date();
        const sameDay = date.toDateString() === now.toDateString();
        if (sameDay) {
          return new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false }).format(date);
        }
        const days = Math.floor((now - date) / 86400000);
        if (days === 1) return "昨天";
        if (date.getFullYear() === now.getFullYear()) {
          return new Intl.DateTimeFormat("zh-CN", { month: "numeric", day: "numeric" }).format(date);
        }
        return new Intl.DateTimeFormat("zh-CN", { year: "2-digit", month: "numeric", day: "numeric" }).format(date);
      }

      function getRealAttachments(mail) {
        return (mail?.attachments || []).filter((attachment) => attachment?.name && attachment.name !== "无附件");
      }

      function getMailText(mail) {
        return [mail?.subject || "", mail?.sender || "", ...(mail?.body || [])].join(" ");
      }

      function getVisibleMails() {
        let records = mailRecords;
        if (activeFolder === "starred") {
          records = mailRecords.filter((mail) => starredMailIds.has(mail.id) && !deletedMailIds.has(mail.id));
        } else if (activeFolder === "unprocessed") {
          records = mailRecords.filter((mail) => !processedMailIds.has(mail.id) && !deletedMailIds.has(mail.id));
        } else if (activeFolder === "processed") {
          records = mailRecords.filter((mail) => processedMailIds.has(mail.id) && !deletedMailIds.has(mail.id));
        } else if (activeFolder === "new") {
          records = mailRecords.filter((mail) => newMailIds.has(mail.id) && !deletedMailIds.has(mail.id));
        } else {
          records = mailRecords.filter((mail) => !deletedMailIds.has(mail.id));
        }

        if (activeLabel) {
          records = mailRecords.filter((mail) => !deletedMailIds.has(mail.id) && categorizeMail(mail) === activeLabel);
        }

        const query = elements.search.value.trim().toLowerCase();
        if (query) {
          records = records.filter((mail) => getMailText(mail).toLowerCase().includes(query));
        }
        return records;
      }

      function updateNavigationCounts() {
        const availableMails = mailRecords.filter((mail) => !deletedMailIds.has(mail.id));
        const labelCounts = Object.fromEntries(Object.keys(categoryStyles).map((id) => [id, 0]));
        availableMails.forEach((mail) => {
          const category = categorizeMail(mail);
          labelCounts[category] = (labelCounts[category] || 0) + 1;
        });
        elements.inboxCount.textContent = availableMails.length;
        elements.starredCount.textContent = starredMailIds.size;
        elements.unprocessedCount.textContent = availableMails.filter((mail) => !processedMailIds.has(mail.id)).length;
        elements.processedCount.textContent = availableMails.filter((mail) => processedMailIds.has(mail.id)).length;
        elements.newCount.textContent = availableMails.filter((mail) => newMailIds.has(mail.id)).length;
        document.querySelectorAll("[data-label-count]").forEach((counter) => {
          const category = counter.dataset.labelCount;
          const count = labelCounts[category] || 0;
          counter.textContent = count;
          const button = counter.closest("[data-label]");
          if (button) {
            const details = categoryStyles[category];
            const codePrefix = details.code ? `${details.code} · ` : "";
            button.setAttribute("aria-label", `${codePrefix}${details.label}，${count} 封邮件。${details.description}`);
          }
        });
      }

      function renderList() {
        const records = getVisibleMails();
        elements.count.textContent = `${records.length} 封邮件`;
        elements.folderTitle.textContent = activeLabel ? labelTitles[activeLabel] : folderTitles[activeFolder];
        elements.searchClear.classList.toggle("visible", Boolean(elements.search.value));
        updateNavigationCounts();

        if (!records.length) {
          const isSearch = Boolean(elements.search.value.trim());
          elements.list.innerHTML = `
            <div class="list-empty">
              <div>
                <div class="empty-illustration" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24">
                    ${isSearch
                      ? '<circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>'
                      : '<rect x="3.5" y="5" width="17" height="14" rx="3"></rect><path d="m5.5 8 6.5 5 6.5-5"></path>'}
                  </svg>
                </div>
                <h2>${isSearch ? "没有找到相关邮件" : "这里还没有邮件"}</h2>
                <p>${isSearch ? "尝试更换关键词，或清除搜索条件。" : "同步收件箱后，新邮件会显示在这里。"}</p>
              </div>
            </div>`;
          return;
        }

        elements.list.innerHTML = records.map((mail) => {
          const category = categoryStyles[categorizeMail(mail)];
          const hasAttachments = getRealAttachments(mail).length > 0;
          const isStarred = starredMailIds.has(mail.id);
          const preview = (mail.body || []).join(" ").replace(/\s+/g, " ").trim() || "这封邮件没有正文预览";
          return `
            <button class="mail-item${mail.id === activeMailId ? " active" : ""}" type="button" data-mail-id="${escapeHtml(mail.id)}">
              <span class="sender-avatar" style="--avatar-color: ${getAvatarColor(mail.sender)}">${escapeHtml(getInitial(mail.sender))}</span>
              <span class="mail-item-content">
                <span class="mail-item-top">
                  <span class="mail-sender">${escapeHtml(getDisplayName(mail.sender))}</span>
                  <time class="mail-time">${escapeHtml(formatListTime(mail.time))}</time>
                </span>
                <span class="mail-subject">${escapeHtml(mail.subject || "(无主题)")}</span>
                <span class="mail-preview">${escapeHtml(preview)}</span>
                <span class="mail-item-footer">
                  <span class="mail-category" style="--category-color: ${category.color}">${escapeHtml(category.label)}</span>
                  <span>
                    ${isStarred ? '<span class="star-indicator" aria-label="已标星"><svg class="icon" viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"></path></svg></span>' : ""}
                    ${hasAttachments ? '<span class="attachment-indicator" aria-label="有附件"><svg class="icon" viewBox="0 0 24 24"><path d="m20.5 11.5-8.2 8.2a5 5 0 0 1-7.1-7.1l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 1 1-2.8-2.8l8.2-8.2"></path></svg></span>' : ""}
                  </span>
                </span>
              </span>
            </button>`;
        }).join("");

        elements.list.querySelectorAll("[data-mail-id]").forEach((item) => {
          item.addEventListener("click", () => setActiveMail(item.dataset.mailId));
        });
      }

      function renderReader(mail) {
        const hasMail = Boolean(mail);
        elements.readerEmpty.hidden = hasMail;
        elements.readerContent.hidden = !hasMail;
        [elements.processedButton, elements.starButton, elements.inlineStarButton, elements.replyButton, elements.forwardButton, elements.deleteButton, elements.refreshExtractionButton]
          .forEach((button) => { button.disabled = !hasMail; });

        if (!mail) {
          elements.readerPosition.textContent = "选择一封邮件开始阅读";
          return;
        }

        elements.readerContent.style.animation = "none";
        void elements.readerContent.offsetHeight;
        elements.readerContent.style.animation = "";
        elements.readerScroll.scrollTop = 0;
        elements.messageTitle.textContent = mail.subject || "(无主题)";
        elements.messageSender.textContent = mail.sender || "未知发件人";
        elements.messageRecipient.textContent = `收件人：${mail.recipients || "未知"}`;
        elements.messageTime.textContent = formatDisplayTime(mail.time);
        elements.messageTime.dateTime = mail.time || "";
        elements.messageAvatar.textContent = getInitial(mail.sender);
        elements.messageAvatar.style.setProperty("--avatar-color", getAvatarColor(mail.sender));

        const visible = getVisibleMails();
        const index = visible.findIndex((item) => item.id === mail.id);
        elements.readerPosition.innerHTML = index >= 0
          ? `<strong>${index + 1}</strong> / ${visible.length}`
          : "邮件详情";

        renderBody(mail);
        renderAttachments(mail);
        updateProcessedState();
        updateStarState();
      }

      function renderBody(mail) {
        const lines = mail?.body?.length ? mail.body : ["(无正文)"];
        elements.mailBody.innerHTML = lines.map((line) => `<p>${escapeHtml(line)}</p>`).join("");
        const textLength = lines.join("").length;
        const shouldCollapse = lines.length > 9 || textLength > 900;
        bodyExpanded = false;
        elements.mailBody.classList.toggle("is-collapsed", shouldCollapse);
        elements.expandBodyButton.classList.toggle("visible", shouldCollapse);
        elements.expandBodyButton.querySelector("span").textContent = "展开全文";
      }

      function getFileMeta(attachment) {
        const mime = String(attachment.type || "").toLowerCase();
        if (mime.includes("spreadsheet") || mime.includes("excel") || /\.xlsx?$/i.test(attachment.name)) return "Excel 表格";
        if (mime.includes("pdf") || /\.pdf$/i.test(attachment.name)) return "PDF 文档";
        if (mime.includes("image") || /\.(png|jpe?g|gif|webp)$/i.test(attachment.name)) return "图片";
        if (mime.includes("word") || /\.docx?$/i.test(attachment.name)) return "Word 文档";
        return "附件";
      }

      function renderAttachments(mail) {
        const attachments = getRealAttachments(mail);
        elements.attachmentsSection.hidden = !attachments.length;
        elements.attachmentCount.textContent = `${attachments.length} 个文件`;
        elements.attachments.innerHTML = attachments.map((attachment) => {
          const target = attachment.previewPath || attachment.downloadUrl || "#";
          const summary = (attachment.summary || []).join(" · ") || getFileMeta(attachment);
          return `
            <a class="file-chip" href="${escapeHtml(target)}" target="_blank" rel="noopener noreferrer">
              <span class="file-type-icon" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24">
                  <path d="M6 3h8l4 4v14H6Z"></path><path d="M14 3v5h4M9 13h6M9 17h4"></path>
                </svg>
              </span>
              <span class="file-copy">
                <span class="file-name" title="${escapeHtml(attachment.name)}">${escapeHtml(attachment.name)}</span>
                <span class="file-meta">${escapeHtml(summary)}</span>
              </span>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 5h5v5M13 11l6-6M19 13v6H5V5h6"></path>
              </svg>
            </a>`;
        }).join("");
      }

      function setExtractionStatus(state, text) {
        elements.extractionStatus.dataset.state = state;
        elements.extractionStatus.textContent = text;
        elements.extractionCard.setAttribute("aria-busy", state === "pending" ? "true" : "false");
      }

      function setExtractionAction(label) {
        elements.refreshExtractionButton.querySelector(".button-label").textContent = label;
        elements.refreshExtractionButton.setAttribute("aria-label", label);
      }

      function renderExtractionSkeleton(mode = "base") {
        elements.extractionCard.classList.remove("is-ready");
        const isLlm = mode === "llm";
        setExtractionStatus("pending", isLlm ? "正在智能识别型号" : "正在进行基础规则提取");
        setExtractionAction(isLlm ? "型号识别中" : "自动识别型号");
        elements.extractionResult.innerHTML = `
          <div class="skeleton-list" aria-label="${isLlm ? "正在智能识别型号" : "正在进行基础规则提取"}">
            ${Array.from({ length: 6 }, () => '<div class="skeleton-item"><div class="skeleton-line"></div><div class="skeleton-line"></div></div>').join("")}
          </div>`;
      }

      function iconMarkup(name) {
        const icons = {
          briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V4h6v3M3 12h18"></path>',
          user: '<circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path>',
          package: '<path d="m4 7 8-4 8 4-8 4-8-4Z"></path><path d="m4 7 8 4 8-4v10l-8 4-8-4ZM12 11v10"></path>',
          quantity: '<path d="M5 4h14v16H5Z"></path><path d="M8 8h8M8 12h5M8 16h3"></path>',
          calendar: '<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path>',
          flag: '<path d="M5 21V4M5 5h11l-2 4 2 4H5"></path>',
          attachment: '<path d="m20.5 11.5-8.2 8.2a5 5 0 0 1-7.1-7.1l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 1 1-2.8-2.8l8.2-8.2"></path>',
          note: '<path d="M5 4h14v16H5Z"></path><path d="M8 8h8M8 12h8M8 16h5"></path>'
        };
        return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.note}</svg>`;
      }

      function normalizeValue(value, fallback = "邮件未说明") {
        if (value === null || value === undefined || value === "") return fallback;
        return String(value);
      }

      function resultRow({ icon, label, value, tags = [], wide = false }) {
        const copyText = tags.length ? tags.join("、") : normalizeValue(value);
        const valueHtml = tags.length
          ? `<div class="tag-list">${tags.map((tag) => `<span class="result-tag">${escapeHtml(tag)}</span>`).join("")}</div>`
          : escapeHtml(normalizeValue(value));
        return `
          <div class="result-row${wide ? " wide" : ""}">
            <span class="result-icon">${iconMarkup(icon)}</span>
            <span class="result-copy">
              <span class="result-label">${escapeHtml(label)}</span>
              <span class="result-value">${valueHtml}</span>
            </span>
            <button class="copy-button" type="button" data-copy="${escapeHtml(copyText)}" aria-label="复制${escapeHtml(label)}">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V5H5v11h3"></path>
              </svg>
            </button>
          </div>`;
      }

      function purchaseItemsRow(items) {
        const normalizedItems = items.length
          ? items
          : [{ model: "暂未识别到明确型号", name: "", quantity: null, unit: "" }];
        const countLabel = items.length ? `${items.length} 个采购项` : "待确认";
        const itemRows = normalizedItems.map((item, index) => {
          const model = item.model || item.name || "未识别产品";
          const secondaryName = item.model && item.name && item.name !== item.model ? item.name : "";
          const hasQuantity = item.quantity !== null && item.quantity !== undefined && item.quantity !== "";
          const quantity = hasQuantity ? String(item.quantity) : "待确认";
          const unit = hasQuantity ? (item.unit || "") : "";
          const copyValue = [model, secondaryName, hasQuantity ? `${quantity}${unit ? ` ${unit}` : ""}` : "数量待确认"]
            .filter(Boolean)
            .join(" · ");
          return `
            <div class="purchase-item">
              <span class="purchase-index">${String(index + 1).padStart(2, "0")}</span>
              <span class="purchase-product">
                <span class="purchase-model">${escapeHtml(model)}</span>
                ${secondaryName ? `<span class="purchase-name">${escapeHtml(secondaryName)}</span>` : ""}
              </span>
              <span class="purchase-quantity${hasQuantity ? "" : " pending"}">
                <strong>${escapeHtml(quantity)}</strong>
                ${unit ? `<span>${escapeHtml(unit)}</span>` : ""}
              </span>
              <button class="copy-button" type="button" data-copy="${escapeHtml(copyValue)}" aria-label="复制采购项 ${index + 1}">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V5H5v11h3"></path>
                </svg>
              </button>
            </div>`;
        }).join("");
        return `
          <div class="result-row wide purchase-result-row">
            <span class="result-icon">${iconMarkup("package")}</span>
            <div class="result-copy">
              <span class="purchase-heading">
                <span class="result-label">采购产品</span>
                <span class="purchase-count">${countLabel}</span>
              </span>
              <div class="purchase-list">${itemRows}</div>
            </div>
          </div>`;
      }

      function renderAnalyzedResult(mail, payload, options = {}) {
        const models = (payload.product_models || []).slice(0, 10);
        const quantities = (payload.quantities || []).slice(0, 10);
        const itemCount = Math.max(models.length, quantities.length);
        const purchaseItems = Array.from({ length: itemCount }, (_, index) => ({
          model: models[index]?.value || "",
          name: "",
          quantity: quantities[index]?.value ?? null,
          unit: quantities[index]?.unit || ""
        }));
        const attachments = getRealAttachments(mail).map((item) => item.name);
        const rows = [
          resultRow({ icon: "briefcase", label: "业务类型", value: payload.business_type?.label || "待确认" }),
          resultRow({ icon: "user", label: "客户", value: getDisplayName(mail.sender) }),
          resultRow({ icon: "package", label: "产品类别", value: payload.product_type?.label || "待确认" }),
          resultRow({ icon: "calendar", label: "交期", value: "邮件未说明" }),
          purchaseItemsRow(purchaseItems),
          resultRow({ icon: "flag", label: "待补充信息", value: (payload.missing_fields || []).length ? "部分关键信息需要确认" : "关键信息较完整", wide: true })
        ];
        if (attachments.length) {
          rows.push(resultRow({ icon: "attachment", label: "附件", tags: attachments, wide: true }));
        }
        const isLlmFallback = options.source === "llm-fallback";
        finishExtraction(
          rows.join(""),
          isLlmFallback
            ? "LLM 未返回可用结果，当前内容仅来自基础规则，请人工确认型号"
            : payload.warnings?.length
              ? "基础规则已完成，部分附件内容需要人工确认"
              : "基础规则已从邮件正文与附件中整理可用信息",
          {
            state: isLlmFallback ? "warning" : "base",
            status: isLlmFallback ? "LLM 识别未完成 · 已显示基础结果" : "基础规则提取完成",
            actionLabel: isLlmFallback ? "重试 LLM 识别" : "自动识别型号"
          }
        );
      }

      function renderDraftResult(mail, payload, options = {}) {
        const draft = payload.order_draft || {};
        const isPartial = options.partial || payload.status === "partial_success";
        const isFastPath = payload.provider === "local_structured"
          || payload.processing?.mode === "structured_fast_path";
        const isCacheHit = payload.processing?.cache_hit === true;
        const completedSourceLabel = isCacheHit
          ? "已复用识别结果"
          : isFastPath
            ? "本地快速识别完成"
            : "DeepSeek 识别完成";
        const products = (draft.products || []).slice(0, 10);
        const purchaseItems = products.map((item) => ({
          model: item.product_model || "",
          name: item.product_name || "",
          quantity: item.quantity ?? null,
          unit: item.unit || ""
        }));
        const requirements = draft.requirements || {};
        const attachments = getRealAttachments(mail).map((item) => item.name);
        const requirementTags = [
          requirements.delivery_terms,
          requirements.payment_terms,
          requirements.destination,
          requirements.project_name
        ].filter(Boolean);
        const rows = [
          resultRow({ icon: "briefcase", label: "业务类型", value: draft.business_type?.label || "待确认" }),
          resultRow({ icon: "user", label: "客户", value: requirements.company || getDisplayName(mail.sender) }),
          resultRow({ icon: "package", label: "产品类别", value: draft.product_type?.label || "待确认" }),
          resultRow({ icon: "calendar", label: "交期", value: requirements.delivery_date || "邮件未说明" }),
          purchaseItemsRow(purchaseItems),
          resultRow({ icon: "user", label: "联系人", value: requirements.contact_person || getDisplayName(mail.sender), wide: true }),
          resultRow({ icon: "flag", label: "重点要求", tags: requirementTags.length ? requirementTags : ["未发现额外要求"], wide: true })
        ];
        if (attachments.length) {
          rows.push(resultRow({ icon: "attachment", label: "附件", tags: attachments, wide: true }));
        }
        const recognizedModelCount = products.filter((item) => String(item.product_model || "").trim()).length;
        finishExtraction(
          rows.join(""),
          recognizedModelCount
            ? isPartial
              ? "已保留可靠的产品型号和名称，未完成的业务字段请人工确认"
              : draft.missing_fields?.length
                ? `${completedSourceLabel}，仍有少量信息需要人工确认`
                : `${completedSourceLabel}，型号和业务信息已整理`
            : `${completedSourceLabel}，但未识别到明确产品型号，请人工确认`,
          {
            state: recognizedModelCount && !isPartial ? "success" : "warning",
            status: recognizedModelCount
              ? isPartial
                ? `部分识别完成 · 已保留 ${recognizedModelCount} 个型号`
                : `${completedSourceLabel} · ${recognizedModelCount} 个`
              : `${completedSourceLabel} · 未识别到型号`,
            actionLabel: "重新识别型号"
          }
        );
        return recognizedModelCount;
      }

      function finishExtraction(rowsHtml, note, options = {}) {
        setExtractionStatus(options.state || "base", options.status || "基础规则提取完成");
        setExtractionAction(options.actionLabel || "自动识别型号");
        elements.extractionResult.innerHTML = `
          <div class="result-grid">${rowsHtml}</div>
          <p class="result-note">${iconMarkup("note")}<span>${escapeHtml(note)}</span></p>`;
        elements.extractionCard.classList.remove("is-ready");
        void elements.extractionCard.offsetHeight;
        elements.extractionCard.classList.add("is-ready");
        elements.extractionResult.querySelectorAll("[data-copy]").forEach((button) => {
          button.addEventListener("click", () => copyText(button.dataset.copy));
        });
      }

      function renderExtractionError(mode = "base") {
        const isLlm = mode === "llm";
        setExtractionStatus("error", isLlm ? "LLM 型号识别失败" : "基础规则提取失败");
        setExtractionAction(isLlm ? "重试 LLM 识别" : "自动识别型号");
        elements.extractionResult.innerHTML = `
          <div class="result-empty">
            <div>
              <div class="empty-illustration" aria-hidden="true">${iconMarkup("note")}</div>
              <strong>${isLlm ? "未获得 LLM 识别结果" : "基础提取结果暂不可用"}</strong>
              <p>${isLlm ? "请检查模型配置或稍后重试。邮件正文和附件没有被修改。" : "可点击“自动识别型号”再次尝试。邮件正文和附件没有被修改。"}</p>
            </div>
          </div>`;
      }

      async function copyText(value) {
        try {
          await navigator.clipboard.writeText(value);
          showToast("已复制到剪贴板", "success");
        } catch {
          showToast("复制失败，请手动选择内容", "error");
        }
      }

      async function loadExtraction(mail, options = {}) {
        if (!mail) return;
        const requestId = ++currentExtractionRequest;
        const cached = extractionCacheEnabled ? extractionCache.get(mail.id) : null;
        if (!options.force && cached) {
          if (cached.kind === "draft") renderDraftResult(mail, cached.payload, { partial: cached.payload.status === "partial_success" });
          else renderAnalyzedResult(mail, cached.payload, { source: cached.source });
          return;
        }

        renderExtractionSkeleton(options.deep ? "llm" : "base");
        elements.refreshExtractionButton.disabled = true;
        try {
          const endpoint = options.deep ? "generate-order-draft" : "analyze-order";
          const response = await fetch(`/api/mail/${encodeURIComponent(mail.id)}/${endpoint}`, { method: "POST" });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "提取失败");
          if (requestId !== currentExtractionRequest || mail.id !== activeMailId) return;

          if (options.deep && ["success", "partial_success"].includes(payload.status) && payload.order_draft) {
            if (extractionCacheEnabled) {
              extractionCache.set(mail.id, { kind: "draft", payload });
            }
            const isPartial = payload.status === "partial_success";
            const isFastPath = payload.provider === "local_structured"
              || payload.processing?.mode === "structured_fast_path";
            const isCacheHit = payload.processing?.cache_hit === true;
            const recognizedModelCount = renderDraftResult(mail, payload, { partial: isPartial });
            showToast(
              recognizedModelCount
                ? isPartial
                  ? `部分识别完成：已保留 ${recognizedModelCount} 个产品型号`
                  : isCacheHit
                    ? `已复用识别结果：找到 ${recognizedModelCount} 个产品型号`
                    : isFastPath
                      ? `快速识别完成：找到 ${recognizedModelCount} 个产品型号`
                      : `DeepSeek 识别完成：找到 ${recognizedModelCount} 个产品型号`
                : "智能识别完成，但未识别到明确型号",
              recognizedModelCount && !isPartial ? "success" : "warning"
            );
          } else if (options.deep) {
            const fallbackResponse = await fetch(`/api/mail/${encodeURIComponent(mail.id)}/analyze-order`, { method: "POST" });
            const fallback = await fallbackResponse.json();
            if (!fallbackResponse.ok) throw new Error("提取失败");
            if (extractionCacheEnabled) {
              extractionCache.set(mail.id, { kind: "analysis", source: "llm-fallback", payload: fallback });
            }
            renderAnalyzedResult(mail, fallback, { source: "llm-fallback" });
            showToast("LLM 识别未完成，当前显示基础规则结果", "warning");
          } else {
            if (extractionCacheEnabled) {
              extractionCache.set(mail.id, { kind: "analysis", source: "base", payload });
            }
            renderAnalyzedResult(mail, payload);
          }
        } catch {
          if (requestId === currentExtractionRequest && mail.id === activeMailId) {
            renderExtractionError(options.deep ? "llm" : "base");
            showToast(options.deep ? "LLM 型号识别失败，请检查模型配置后重试" : "基础规则提取失败，请稍后重试", "error");
          }
        } finally {
          if (requestId === currentExtractionRequest) {
            elements.refreshExtractionButton.disabled = false;
          }
        }
      }

      function setActiveMail(mailId) {
        activeMailId = mailId || "";
        const mail = getActiveMail();
        renderList();
        renderReader(mail);
        if (mail) {
          elements.body.classList.add("mail-open");
          loadExtraction(mail);
        } else {
          elements.body.classList.remove("mail-open");
        }
      }

      function selectFolder(folder = "inbox", label = "") {
        activeFolder = folder;
        activeLabel = label;
        elements.search.value = "";
        document.querySelectorAll(".nav-item").forEach((item) => item.classList.remove("active"));
        const selector = label ? `[data-label="${label}"]` : `[data-folder="${folder}"]`;
        document.querySelector(selector)?.classList.add("active");
        const records = getVisibleMails();
        setActiveMail(records[0]?.id || "");
        elements.body.classList.remove("nav-open");
      }

      function updateStarState() {
        const isStarred = starredMailIds.has(activeMailId);
        elements.starButton.classList.toggle("active", isStarred);
        elements.inlineStarButton.classList.toggle("active", isStarred);
        elements.starButton.setAttribute("aria-label", isStarred ? "取消收藏" : "收藏邮件");
        elements.inlineStarButton.setAttribute("aria-label", isStarred ? "取消收藏" : "收藏邮件");
      }

      function updateProcessedState() {
        const isProcessed = processedMailIds.has(activeMailId);
        const label = isProcessed ? "标记为未处理" : "标记为已处理";
        elements.processedButton.classList.toggle("active", isProcessed);
        elements.processedButton.setAttribute("aria-label", label);
        elements.processedButton.title = label;
      }

      function toggleProcessed() {
        if (!activeMailId) return;
        const wasProcessed = processedMailIds.has(activeMailId);
        if (wasProcessed) {
          processedMailIds.delete(activeMailId);
          showToast("已标记为未处理");
        } else {
          processedMailIds.add(activeMailId);
          newMailIds.delete(activeMailId);
          showToast("已标记为已处理", "success");
        }
        persistMailStatus();
        updateProcessedState();

        if ((activeFolder === "unprocessed" && !wasProcessed) || (activeFolder === "processed" && wasProcessed) || (activeFolder === "new" && !wasProcessed)) {
          const next = getVisibleMails().find((mail) => mail.id !== activeMailId);
          setActiveMail(next?.id || "");
          return;
        }
        renderList();
      }

      function toggleStar() {
        if (!activeMailId) return;
        if (starredMailIds.has(activeMailId)) {
          starredMailIds.delete(activeMailId);
          showToast("已取消收藏");
        } else {
          starredMailIds.add(activeMailId);
          showToast("已收藏邮件", "success");
        }
        updateStarState();
        renderList();
      }

      function deleteActiveMail() {
        const mail = getActiveMail();
        if (!mail || sentMails.some((item) => item.id === mail.id)) return;
        if (deletedMailIds.has(mail.id)) {
          deletedMailIds.delete(mail.id);
          showToast("邮件已移回收件箱", "success");
        } else {
          deletedMailIds.add(mail.id);
          starredMailIds.delete(mail.id);
          showToast("邮件已移至已删除");
        }
        const next = getVisibleMails().find((item) => item.id !== mail.id);
        setActiveMail(next?.id || "");
      }

      function openCompose(mode = "new") {
        const mail = getActiveMail();
        elements.composeForm.reset();
        elements.composeDialogTitle.textContent = mode === "reply" ? "回复邮件" : mode === "forward" ? "转发邮件" : "新邮件";

        if (mode === "reply" && mail) {
          elements.composeTo.value = getEmailAddress(mail.sender);
          elements.composeSubject.value = /^(re|回复)[:：]/i.test(mail.subject || "") ? mail.subject : `回复：${mail.subject || ""}`;
          elements.composeText.value = "\n\n";
        } else if (mode === "forward" && mail) {
          elements.composeSubject.value = /^(fw|fwd|转发)[:：]/i.test(mail.subject || "") ? mail.subject : `转发：${mail.subject || ""}`;
          elements.composeText.value = `\n\n---------- 转发邮件 ----------\n发件人：${mail.sender || ""}\n时间：${formatDisplayTime(mail.time)}\n主题：${mail.subject || ""}\n\n${(mail.body || []).join("\n")}`;
        }
        showDialog(elements.composeDialog);
        window.setTimeout(() => (mode === "forward" ? elements.composeTo : mode === "reply" ? elements.composeText : elements.composeTo).focus(), 60);
      }

      async function sendMail(event) {
        event.preventDefault();
        const payload = {
          to: elements.composeTo.value.trim(),
          subject: elements.composeSubject.value.trim(),
          text: elements.composeText.value.trim()
        };
        elements.sendButton.disabled = true;
        elements.sendButton.lastChild.textContent = " 发送中";
        try {
          const response = await fetch("/api/mail/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "发送失败");
          sentMails.unshift({
            id: `sent-${Date.now()}`,
            subject: payload.subject,
            sender: "我",
            recipients: payload.to,
            time: new Date().toISOString(),
            listEmail: payload.to,
            body: payload.text.split("\n"),
            attachments: []
          });
          closeDialog(elements.composeDialog);
          updateNavigationCounts();
          showToast("邮件已发送", "success");
        } catch (error) {
          showToast(error.message || "邮件发送失败，请稍后重试", "error");
        } finally {
          elements.sendButton.disabled = false;
          elements.sendButton.lastChild.textContent = " 发送邮件";
        }
      }

      function renderMailConfig(config) {
        if (!config) {
          elements.connectionEmail.textContent = "连接状态待确认";
          elements.mailConfigSummary.innerHTML = `
            <div class="connection-row"><span>连接状态</span><strong>暂时无法读取</strong></div>`;
          return;
        }
        const email = config.email || config.agent?.alias || "当前邮箱";
        const receiveReady = config.mode === "imap_smtp" ? Boolean(config.imap?.configured) : true;
        const sendReady = config.mode === "imap_smtp" ? Boolean(config.smtp?.configured) : true;
        elements.connectionEmail.textContent = email;
        elements.mailConfigSummary.innerHTML = `
          <div class="connection-row"><span>邮箱账户</span><strong>${escapeHtml(email)}</strong></div>
          <div class="connection-row"><span>接收邮件</span><strong>${receiveReady ? "已就绪" : "需要检查连接"}</strong></div>
          <div class="connection-row"><span>发送邮件</span><strong>${sendReady ? "已就绪" : "需要检查连接"}</strong></div>`;
      }

      async function loadMailConfig() {
        if (window.location.protocol === "file:") {
          renderMailConfig({ email: window.__IMPORTED_MAIL_DATA__?.alias || "本地邮件", mode: "file" });
          return;
        }
        try {
          const response = await fetch("/api/mail/config");
          if (!response.ok) throw new Error("连接失败");
          renderMailConfig(await response.json());
        } catch {
          renderMailConfig(null);
        }
      }

      function loadEmbeddedMails() {
        const payload = window.__IMPORTED_MAIL_DATA__;
        if (Array.isArray(payload?.mails) && payload.mails.length) {
          mailRecords = payload.mails;
          reconcileMailStatus();
          elements.source.textContent = "本地邮件";
          selectFolder("inbox");
          return true;
        }
        return false;
      }

      async function loadPersistedMails() {
        if (window.location.protocol === "file:" && loadEmbeddedMails()) return;
        try {
          const response = await fetch("/api/mail/list");
          if (!response.ok) throw new Error("服务暂未启动");
          const payload = await response.json();
          mailRecords = Array.isArray(payload.mails) ? payload.mails : [];
          reconcileMailStatus();
          elements.source.textContent = mailRecords.length ? "已同步" : "等待同步";
          selectFolder("inbox");
          if (!mailRecords.length) showToast("收件箱暂无邮件，可以点击同步按钮更新");
        } catch {
          if (!loadEmbeddedMails()) {
            elements.source.textContent = "连接失败";
            renderList();
            showToast("暂时无法读取收件箱", "error");
          }
        }
      }

      async function importInbox() {
        if (window.location.protocol === "file:") {
          if (loadEmbeddedMails()) showToast("已刷新本地邮件", "success");
          return;
        }
        elements.importButton.disabled = true;
        elements.source.textContent = "同步中…";
        try {
          const response = await fetch("/api/mail/import", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ limit: 50 })
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "同步失败");
          mailRecords = payload.mails || [];
          reconcileMailStatus();
          extractionCache.clear();
          elements.source.textContent = "刚刚同步";
          selectFolder("inbox");
          const added = payload.syncLog?.added || 0;
          showToast(
            added
              ? `同步完成，新增 ${added} 封，当前保留 ${mailRecords.length} 封邮件`
              : `同步完成，当前保留 ${mailRecords.length} 封邮件`,
            "success"
          );
        } catch (error) {
          elements.source.textContent = "同步失败";
          showToast(error.message || "同步失败，请稍后重试", "error");
        } finally {
          elements.importButton.disabled = false;
        }
      }

      document.querySelectorAll("[data-folder]").forEach((button) => {
        button.addEventListener("click", () => selectFolder(button.dataset.folder));
      });
      document.querySelectorAll("[data-label]").forEach((button) => {
        button.addEventListener("click", () => selectFolder("inbox", button.dataset.label));
      });
      elements.search.addEventListener("input", renderList);
      elements.searchClear.addEventListener("click", () => {
        elements.search.value = "";
        elements.search.focus();
        renderList();
      });
      elements.importButton.addEventListener("click", importInbox);
      elements.composeButton?.addEventListener("click", () => openCompose("new"));
      elements.processedButton.addEventListener("click", toggleProcessed);
      elements.replyButton.addEventListener("click", () => openCompose("reply"));
      elements.forwardButton.addEventListener("click", () => openCompose("forward"));
      elements.starButton.addEventListener("click", toggleStar);
      elements.inlineStarButton.addEventListener("click", toggleStar);
      elements.deleteButton.addEventListener("click", deleteActiveMail);
      elements.expandBodyButton.addEventListener("click", () => {
        bodyExpanded = !bodyExpanded;
        elements.mailBody.classList.toggle("is-collapsed", !bodyExpanded);
        elements.expandBodyButton.querySelector("span").textContent = bodyExpanded ? "收起全文" : "展开全文";
      });
      elements.refreshExtractionButton.addEventListener("click", () => {
        const mail = getActiveMail();
        if (mail) {
          showToast("已开始智能型号识别，正在分析邮件正文和附件");
          loadExtraction(mail, { force: true, deep: true });
        }
      });
      elements.guideButton.addEventListener("click", () => showDialog(elements.guideDialog));
      elements.guideCloseButton.addEventListener("click", () => closeDialog(elements.guideDialog));
      elements.composeCloseButton.addEventListener("click", () => closeDialog(elements.composeDialog));
      elements.composeCancelButton.addEventListener("click", () => closeDialog(elements.composeDialog));
      elements.composeForm.addEventListener("submit", sendMail);
      elements.mobileMenuButton.addEventListener("click", () => elements.body.classList.add("nav-open"));
      elements.mobileScrim.addEventListener("click", () => elements.body.classList.remove("nav-open"));
      elements.mobileBackButton.addEventListener("click", () => elements.body.classList.remove("mail-open"));

      [elements.guideDialog, elements.composeDialog].forEach((dialog) => {
        dialog.addEventListener("click", (event) => {
          if (event.target === dialog) closeDialog(dialog);
        });
      });

      renderList();
      renderReader(null);
      loadMailConfig();
      loadPersistedMails();
    </script>
  </body>
</html>
