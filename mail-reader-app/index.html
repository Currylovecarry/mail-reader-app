<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>OrderBridge · 邮件智能订单处理系统</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --surface: #ffffff;
        --surface-soft: #f3f6f7;
        --surface-tint: #eef9f7;
        --line: #ececec;
        --line-strong: #dfe4e6;
        --text: #222222;
        --text-soft: #4f5b62;
        --muted: #69757c;
        --accent: #2fb5a9;
        --accent-strong: #208f87;
        --accent-soft: #dff5f2;
        --danger: #d9434b;
        --danger-soft: #fff0f1;
        --success: #1e8d68;
        --success-soft: #e8f7f1;
        --warning: #ad7311;
        --warning-soft: #fff6df;
        --focus: rgba(47, 181, 169, 0.28);
        --shadow-sm: 0 3px 8px rgba(28, 39, 44, 0.06);
        --shadow-shell: 0 12px 40px rgba(28, 39, 44, 0.08);
        --radius-sm: 10px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --z-sticky: 20;
        --z-drawer: 40;
        --z-modal: 60;
        --z-toast: 80;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--text);
        background: var(--bg);
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button,
      [role="button"] {
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      [tabindex]:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .icon {
        width: 20px;
        height: 20px;
        flex: 0 0 20px;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 220px minmax(320px, 360px) minmax(0, 1fr);
        width: 100%;
        height: 100dvh;
        max-width: 1920px;
        margin: 0 auto;
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--shadow-shell);
      }

      .navigation {
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 24px 16px 18px;
        overflow: hidden auto;
        background: #f8fafb;
        border-right: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        min-height: 44px;
        padding: 0 8px;
        margin-bottom: 24px;
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-title {
        font-size: 16px;
        font-weight: 750;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }

      .brand-subtitle {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }

      .compose-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 44px;
        margin-bottom: 22px;
        border: 1px solid var(--accent);
        border-radius: var(--radius-md);
        color: #ffffff;
        background: var(--accent);
        font-weight: 700;
        cursor: pointer;
        transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1),
          background 200ms ease, box-shadow 200ms ease;
      }

      .compose-button:hover {
        transform: translateY(-1px);
        background: var(--accent-strong);
        box-shadow: 0 4px 8px rgba(47, 181, 169, 0.22);
      }

      .compose-button:active {
        transform: translateY(0);
      }

      .nav-section + .nav-section {
        margin-top: 20px;
      }

      .nav-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 28px;
        padding: 0 10px;
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .nav-item {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 42px;
        gap: 11px;
        padding: 0 10px;
        border: 0;
        border-radius: var(--radius-sm);
        color: var(--text-soft);
        background: transparent;
        text-align: left;
        cursor: pointer;
        transition: color 180ms ease, background 180ms ease, transform 180ms ease;
      }

      .nav-item:hover {
        color: var(--text);
        background: #edf2f3;
        transform: translateX(2px);
      }

      .nav-item.active {
        color: var(--text);
        background: var(--surface);
        box-shadow: var(--shadow-sm);
        font-weight: 700;
      }

      .nav-item.active .icon {
        color: var(--accent-strong);
      }

      .nav-label {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav-count {
        min-width: 22px;
        padding: 2px 6px;
        border-radius: 999px;
        color: var(--muted);
        background: #e9edef;
        font-size: 11px;
        line-height: 18px;
        text-align: center;
      }

      .nav-item.active .nav-count {
        color: var(--accent-strong);
        background: var(--accent-soft);
      }

      .label-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 8px;
        border-radius: 50%;
        background: var(--label-color, var(--accent));
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--label-color, var(--accent)) 14%, transparent);
      }

      .navigation-footer {
        margin-top: auto;
        padding-top: 22px;
      }

      .connection-card {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 48px;
        padding: 8px 9px;
        border: 0;
        border-radius: var(--radius-md);
        color: var(--text-soft);
        background: #eef2f3;
        cursor: pointer;
      }

      .connection-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 4px rgba(30, 141, 104, 0.12);
      }

      .connection-copy {
        min-width: 0;
        text-align: left;
      }

      .connection-copy strong,
      .connection-copy small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .connection-copy strong {
        color: var(--text);
        font-size: 12px;
      }

      .connection-copy small {
        margin-top: 2px;
        color: var(--muted);
        font-size: 10px;
      }

      .mail-column {
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #f5f7f8;
        border-right: 1px solid var(--line);
      }

      .mail-list-header {
        flex: 0 0 auto;
        padding: 23px 18px 14px;
        background: rgba(245, 247, 248, 0.96);
        border-bottom: 1px solid var(--line);
      }

      .list-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 15px;
      }

      .list-title-group {
        min-width: 0;
      }

      .list-title-group h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: -0.025em;
      }

      .list-title-group p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-button {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--text-soft);
        background: transparent;
        cursor: pointer;
        transition: color 180ms ease, background 180ms ease, border-color 180ms ease,
          transform 180ms ease;
      }

      .icon-button:hover {
        color: var(--text);
        background: var(--surface-soft);
        border-color: var(--line);
        transform: translateY(-1px);
      }

      .icon-button.active {
        color: var(--accent-strong);
        background: var(--accent-soft);
      }

      .icon-button.danger:hover {
        color: var(--danger);
        background: var(--danger-soft);
        border-color: transparent;
      }

      .icon-button:disabled {
        cursor: wait;
        opacity: 0.55;
        transform: none;
      }

      .sync-button .icon {
        width: 19px;
        height: 19px;
        transform-origin: center;
      }

      .sync-button:hover {
        color: var(--accent-strong);
        background: var(--accent-soft);
        border-color: transparent;
      }

      .sync-button:active:not(:disabled) {
        transform: scale(0.96);
      }

      .sync-button:disabled .icon {
        animation: sync-rotate 900ms linear infinite;
      }

      @keyframes sync-rotate {
        to {
          transform: rotate(360deg);
        }
      }

      .mobile-menu-button,
      .mobile-back-button {
        display: none;
      }

      .search-box {
        position: relative;
      }

      .search-box .icon {
        position: absolute;
        top: 50%;
        left: 13px;
        width: 17px;
        height: 17px;
        color: var(--muted);
        pointer-events: none;
        transform: translateY(-50%);
      }

      .search-input {
        width: 100%;
        height: 42px;
        padding: 0 40px 0 40px;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        color: var(--text);
        background: var(--surface);
        transition: border-color 180ms ease, box-shadow 180ms ease;
      }

      .search-input::placeholder {
        color: #68757b;
      }

      .search-input:focus {
        border-color: rgba(47, 181, 169, 0.55);
        box-shadow: 0 0 0 3px rgba(47, 181, 169, 0.1);
        outline: 0;
      }

      .search-clear {
        position: absolute;
        top: 50%;
        right: 8px;
        display: none;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 8px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        transform: translateY(-50%);
      }

      .search-clear.visible {
        display: grid;
        place-items: center;
      }

      .mail-list {
        flex: 1;
        min-height: 0;
        overflow: hidden auto;
        overscroll-behavior: contain;
        padding: 12px;
        scroll-padding: 12px;
      }

      .mail-item {
        position: relative;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        gap: 11px;
        width: 100%;
        min-height: 126px;
        padding: 14px;
        border: 1px solid transparent;
        border-radius: var(--radius-lg);
        color: var(--text);
        background: transparent;
        text-align: left;
        cursor: pointer;
        transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1),
          background 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
      }

      .mail-item + .mail-item {
        margin-top: 7px;
      }

      .mail-item:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 4px 8px rgba(28, 39, 44, 0.05);
      }

      .mail-item.active {
        background: var(--surface);
        border-color: #dceae8;
        box-shadow: var(--shadow-sm);
      }

      .mail-item.active::before {
        content: "";
        position: absolute;
        top: 17px;
        left: 6px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }

      .sender-avatar {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        color: #ffffff;
        background: var(--avatar-color, var(--accent));
        font-size: 14px;
        font-weight: 750;
      }

      .mail-item-content {
        min-width: 0;
      }

      .mail-item-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 9px;
        min-width: 0;
      }

      .mail-sender {
        min-width: 0;
        overflow: hidden;
        color: var(--text-soft);
        font-size: 13px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mail-time {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 11px;
      }

      .mail-subject {
        display: -webkit-box;
        margin: 7px 0 5px;
        overflow: hidden;
        font-size: 14px;
        font-weight: 720;
        line-height: 1.45;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .mail-preview {
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .mail-item-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 17px;
        margin-top: 8px;
      }

      .mail-category {
        display: inline-flex;
        align-items: center;
        max-width: calc(100% - 28px);
        gap: 5px;
        color: var(--muted);
        font-size: 10px;
      }

      .mail-category::before {
        content: "";
        width: 6px;
        height: 6px;
        flex: 0 0 6px;
        border-radius: 50%;
        background: var(--category-color, var(--accent));
      }

      .attachment-indicator,
      .star-indicator {
        display: inline-grid;
        place-items: center;
        color: var(--muted);
      }

      .attachment-indicator .icon,
      .star-indicator .icon {
        width: 14px;
        height: 14px;
      }

      .star-indicator {
        color: #e7a72d;
      }

      .list-empty {
        display: grid;
        place-items: center;
        min-height: 100%;
        padding: 34px 24px;
        text-align: center;
      }

      .empty-illustration,
      .welcome-mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 18px;
        color: var(--accent-strong);
        background: var(--accent-soft);
      }

      .list-empty h2,
      .reader-empty h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      .list-empty p,
      .reader-empty p {
        max-width: 34ch;
        margin: 8px auto 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
      }

      .reader-column {
        position: relative;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--surface);
      }

      .reader-toolbar {
        position: relative;
        z-index: var(--z-sticky);
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 68px;
        flex: 0 0 68px;
        padding: 0 28px;
        background: rgba(255, 255, 255, 0.94);
        border-bottom: 1px solid var(--line);
      }

      .reader-toolbar-left,
      .reader-toolbar-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .reader-position {
        color: var(--muted);
        font-size: 12px;
      }

      .reader-position strong {
        color: var(--text);
        font-weight: 650;
      }

      .reader-scroll {
        flex: 1;
        min-height: 0;
        overflow: hidden auto;
        overscroll-behavior: contain;
        scroll-behavior: smooth;
      }

      .reader-content {
        width: min(900px, calc(100% - 64px));
        margin: 0 auto;
        padding: 42px 0 64px;
        animation: content-in 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes content-in {
        from {
          opacity: 0.45;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .reader-empty {
        display: grid;
        place-items: center;
        min-height: 100%;
        padding: 40px;
        text-align: center;
      }

      .reader-empty .welcome-mark {
        width: 78px;
        height: 78px;
        border-radius: 22px;
      }

      .reader-empty .welcome-mark .icon {
        width: 34px;
        height: 34px;
      }

      .message-title-row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .message-title {
        flex: 1;
        margin: 0;
        font-size: 28px;
        font-weight: 760;
        line-height: 1.3;
        letter-spacing: -0.03em;
        text-wrap: balance;
        overflow-wrap: anywhere;
      }

      .inline-star {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        margin-top: 1px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
      }

      .inline-star.active {
        color: #e5a11c;
        background: var(--warning-soft);
      }

      .message-meta {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        margin-top: 24px;
        padding-bottom: 26px;
        border-bottom: 1px solid var(--line);
      }

      .message-meta .sender-avatar {
        width: 44px;
        height: 44px;
      }

      .sender-detail {
        min-width: 0;
      }

      .sender-name {
        overflow: hidden;
        font-size: 14px;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .recipient-line {
        margin-top: 4px;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .message-time {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .mail-body {
        position: relative;
        max-width: 74ch;
        margin-top: 32px;
        color: #2b3337;
        font-size: 15.5px;
        line-height: 1.85;
        overflow-wrap: anywhere;
      }

      .mail-body p {
        margin: 0 0 12px;
        text-wrap: pretty;
      }

      .mail-body.is-collapsed {
        max-height: 430px;
        overflow: hidden;
      }

      .mail-body.is-collapsed::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 110px;
        pointer-events: none;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #ffffff 82%);
      }

      .expand-body-button {
        display: none;
        align-items: center;
        gap: 6px;
        margin: 10px 0 0;
        padding: 8px 12px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        color: var(--text-soft);
        background: var(--surface);
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }

      .expand-body-button.visible {
        display: inline-flex;
      }

      .attachments-section {
        margin-top: 34px;
      }

      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 13px;
      }

      .section-heading h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: -0.015em;
      }

      .section-heading span {
        color: var(--muted);
        font-size: 12px;
      }

      .attachment-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .file-chip {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr) 20px;
        align-items: center;
        gap: 10px;
        min-width: min(270px, 100%);
        max-width: 420px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        color: var(--text);
        background: var(--surface);
        text-decoration: none;
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
      }

      .file-chip:hover {
        transform: translateY(-1px);
        border-color: #cddfdd;
        background: var(--surface-tint);
      }

      .file-type-icon {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        color: var(--accent-strong);
        background: var(--accent-soft);
      }

      .file-copy {
        min-width: 0;
      }

      .file-name {
        display: block;
        overflow: hidden;
        font-size: 12px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-meta {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .extraction-card {
        margin-top: 38px;
        padding: 22px;
        border-radius: var(--radius-lg);
        background: #fbfcfc;
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .extraction-card.is-ready {
        animation: result-in 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes result-in {
        from {
          opacity: 0.45;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .extraction-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .extraction-heading h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      .extraction-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .extraction-status::before {
        content: "i";
        display: grid;
        place-items: center;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        color: var(--text-soft);
        background: var(--surface-soft);
        font-size: 10px;
      }

      .extraction-status[data-state="pending"]::before {
        content: "";
        border: 2px solid var(--line-strong);
        border-top-color: var(--accent-strong);
        background: transparent;
        animation: extraction-status-spin 800ms linear infinite;
      }

      .extraction-status[data-state="success"] {
        color: var(--success);
      }

      .extraction-status[data-state="success"]::before {
        content: "✓";
        color: #ffffff;
        background: var(--success);
      }

      .extraction-status[data-state="warning"] {
        color: var(--warning);
      }

      .extraction-status[data-state="warning"]::before {
        content: "!";
        color: #ffffff;
        background: var(--warning);
      }

      .extraction-status[data-state="error"] {
        color: var(--danger);
      }

      .extraction-status[data-state="error"]::before {
        content: "×";
        color: #ffffff;
        background: var(--danger);
      }

      @keyframes extraction-status-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .secondary-button,
      .primary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 38px;
        padding: 8px 13px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: background 180ms ease, border-color 180ms ease, transform 180ms ease,
          opacity 180ms ease;
      }

      .secondary-button {
        border: 1px solid var(--line-strong);
        color: var(--text-soft);
        background: var(--surface);
      }

      .secondary-button:hover {
        transform: translateY(-1px);
        border-color: #bdd9d6;
        color: var(--accent-strong);
        background: var(--surface-tint);
      }

      .primary-button {
        border: 1px solid var(--accent);
        color: #ffffff;
        background: var(--accent);
      }

      .primary-button:hover {
        transform: translateY(-1px);
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }

      .secondary-button:disabled,
      .primary-button:disabled {
        cursor: wait;
        opacity: 0.6;
        transform: none;
      }

      .result-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        border-radius: var(--radius-md);
        background: var(--line);
      }

      .result-row {
        position: relative;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) 28px;
        gap: 10px;
        align-items: center;
        min-height: 72px;
        padding: 12px;
        background: var(--surface);
      }

      .result-row.wide {
        grid-column: 1 / -1;
      }

      .result-icon {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        color: var(--accent-strong);
        background: var(--accent-soft);
      }

      .result-icon .icon {
        width: 17px;
        height: 17px;
      }

      .result-copy {
        min-width: 0;
      }

      .result-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
      }

      .result-value {
        margin-top: 4px;
        color: var(--text);
        font-size: 13px;
        font-weight: 650;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .result-tag {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 3px 9px;
        border-radius: 999px;
        color: #335f5c;
        background: var(--accent-soft);
        font-size: 11px;
        font-weight: 650;
      }

      .result-tag.neutral {
        color: var(--text-soft);
        background: var(--surface-soft);
      }

      .purchase-result-row {
        grid-template-columns: 34px minmax(0, 1fr);
        align-items: start;
      }

      .purchase-result-row .result-icon {
        margin-top: 1px;
      }

      .purchase-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .purchase-count {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }

      .purchase-list {
        margin-top: 9px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .purchase-item {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) auto 28px;
        align-items: center;
        gap: 10px;
        min-height: 54px;
        padding: 8px 0;
      }

      .purchase-item + .purchase-item {
        border-top: 1px solid var(--line);
      }

      .purchase-index {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        color: var(--accent-strong);
        background: var(--accent-soft);
        font-size: 10px;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
      }

      .purchase-product {
        min-width: 0;
      }

      .purchase-model {
        display: block;
        overflow: hidden;
        color: var(--text);
        font-size: 13px;
        font-weight: 720;
        line-height: 1.45;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .purchase-name {
        display: block;
        margin-top: 2px;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .purchase-quantity {
        display: inline-flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 4px;
        min-width: 72px;
        color: var(--text);
        white-space: nowrap;
      }

      .purchase-quantity strong {
        font-size: 14px;
        font-weight: 760;
        font-variant-numeric: tabular-nums;
      }

      .purchase-quantity span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }

      .purchase-quantity.pending strong {
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }

      .copy-button {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        transition: color 180ms ease, background 180ms ease;
      }

      .copy-button:hover {
        color: var(--accent-strong);
        background: var(--accent-soft);
      }

      .copy-button .icon {
        width: 15px;
        height: 15px;
      }

      .result-note {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }

      .result-note .icon {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        margin-top: 1px;
      }

      .result-empty {
        display: grid;
        place-items: center;
        min-height: 150px;
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }

      .skeleton-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .skeleton-item {
        min-height: 72px;
        padding: 14px;
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .skeleton-line {
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(90deg, #edf0f1 25%, #f7f8f8 50%, #edf0f1 75%);
        background-size: 200% 100%;
        animation: skeleton 1.2s ease-in-out infinite;
      }

      .skeleton-line + .skeleton-line {
        width: 68%;
        margin-top: 12px;
      }

      @keyframes skeleton {
        to {
          background-position: -200% 0;
        }
      }

      .dialog {
        width: min(560px, calc(100vw - 32px));
        max-height: min(760px, calc(100dvh - 32px));
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: var(--radius-lg);
        color: var(--text);
        background: var(--surface);
        box-shadow: 0 24px 70px rgba(28, 39, 44, 0.22);
      }

      .dialog::backdrop {
        background: rgba(30, 38, 42, 0.34);
        backdrop-filter: blur(2px);
      }

      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 64px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
      }

      .dialog-header h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      .dialog-body {
        padding: 20px;
        overflow: auto;
      }

      .dialog-copy {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
      }

      .connection-details {
        display: grid;
        gap: 10px;
      }

      .connection-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 44px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface-soft);
        font-size: 13px;
      }

      .connection-row span {
        color: var(--muted);
      }

      .connection-row strong {
        text-align: right;
        overflow-wrap: anywhere;
      }

      .compose-form {
        display: grid;
        gap: 14px;
      }

      .form-field {
        display: grid;
        gap: 7px;
      }

      .form-field label {
        color: var(--text-soft);
        font-size: 12px;
        font-weight: 700;
      }

      .form-field input,
      .form-field textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        color: var(--text);
        background: var(--surface);
        transition: border-color 180ms ease, box-shadow 180ms ease;
      }

      .form-field input {
        height: 42px;
        padding: 0 12px;
      }

      .form-field textarea {
        min-height: 220px;
        padding: 12px;
        resize: vertical;
        line-height: 1.7;
      }

      .form-field input:focus,
      .form-field textarea:focus {
        border-color: rgba(47, 181, 169, 0.7);
        box-shadow: 0 0 0 3px rgba(47, 181, 169, 0.1);
        outline: 0;
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        margin-top: 4px;
      }

      .toast {
        position: fixed;
        z-index: var(--z-toast);
        right: 24px;
        bottom: 24px;
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr);
        align-items: start;
        gap: 10px;
        width: max-content;
        max-width: min(440px, calc(100vw - 48px));
        min-height: 48px;
        padding: 12px 14px;
        border-radius: var(--radius-md);
        color: #ffffff;
        background: #263236;
        box-shadow: 0 8px 24px rgba(28, 39, 44, 0.18);
        font-size: 13px;
        line-height: 1.5;
        opacity: 0;
        pointer-events: none;
        transform: translateY(12px);
        transition: opacity 200ms ease, transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .toast.success {
        background: #1f6f58;
      }

      .toast.error {
        background: #9f353b;
      }

      .toast.warning {
        background: #82570f;
      }

      .toast .icon {
        width: 18px;
        height: 18px;
        margin-top: 1px;
      }

      .toast span {
        display: block;
        min-width: 0;
        overflow-wrap: anywhere;
        white-space: normal;
      }

      .mobile-scrim {
        display: none;
      }

      @media (max-width: 1180px) {
        .app-shell {
          grid-template-columns: 76px minmax(310px, 345px) minmax(0, 1fr);
        }

        .navigation {
          align-items: center;
          padding-right: 10px;
          padding-left: 10px;
        }

        .brand {
          display: none;
        }

        .brand-copy,
        .compose-button span,
        .nav-heading,
        .nav-label,
        .nav-count,
        .connection-copy,
        .connection-card > .icon {
          display: none;
        }

        .compose-button {
          width: 44px;
          flex: 0 0 44px;
          padding: 0;
        }

        .nav-item {
          justify-content: center;
          width: 44px;
          min-height: 42px;
          padding: 0;
        }

        .label-dot {
          width: 9px;
          height: 9px;
          flex-basis: 9px;
        }

        .connection-card {
          display: grid;
          place-items: center;
          width: 44px;
          padding: 0;
        }

        .reader-content {
          width: min(820px, calc(100% - 48px));
        }
      }

      @media (max-width: 900px) {
        .app-shell {
          grid-template-columns: minmax(300px, 340px) minmax(0, 1fr);
        }

        .navigation {
          position: fixed;
          z-index: var(--z-drawer);
          top: 0;
          bottom: 0;
          left: 0;
          width: 220px;
          align-items: stretch;
          padding: 24px 16px 18px;
          box-shadow: 10px 0 28px rgba(28, 39, 44, 0.12);
          transform: translateX(-105%);
          transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.nav-open .navigation {
          transform: translateX(0);
        }

        .brand {
          display: flex;
          padding: 0 8px;
        }

        .brand-copy,
        .compose-button span,
        .nav-heading,
        .nav-label,
        .nav-count,
        .connection-copy,
        .connection-card > .icon {
          display: block;
        }

        .compose-button {
          width: 100%;
          padding: 0 14px;
        }

        .nav-item {
          justify-content: flex-start;
          width: 100%;
          padding: 0 10px;
        }

        .connection-card {
          display: grid;
          width: 100%;
          padding: 8px 9px;
        }

        .mobile-menu-button {
          display: inline-grid;
        }

        .mobile-scrim {
          position: fixed;
          z-index: calc(var(--z-drawer) - 1);
          inset: 0;
          display: block;
          background: rgba(30, 38, 42, 0.25);
          opacity: 0;
          pointer-events: none;
          transition: opacity 200ms ease;
        }

        body.nav-open .mobile-scrim {
          opacity: 1;
          pointer-events: auto;
        }

        .reader-toolbar {
          padding-right: 18px;
          padding-left: 18px;
        }

        .reader-content {
          width: calc(100% - 40px);
        }
      }

      @media (max-width: 680px) {
        .app-shell {
          display: block;
        }

        .mail-column,
        .reader-column {
          width: 100%;
          height: 100dvh;
        }

        .reader-column {
          display: none;
        }

        body.mail-open .mail-column {
          display: none;
        }

        body.mail-open .reader-column {
          display: flex;
        }

        .mobile-back-button {
          display: inline-grid;
        }

        .reader-toolbar {
          min-height: 60px;
          flex-basis: 60px;
          padding: 0 12px;
        }

        .reader-toolbar-actions {
          gap: 2px;
        }

        .reader-toolbar-actions .icon-button {
          width: 36px;
          height: 36px;
          flex-basis: 36px;
        }

        .reader-position {
          display: none;
        }

        .reader-content {
          width: calc(100% - 32px);
          padding-top: 28px;
          padding-bottom: 44px;
        }

        .message-title {
          font-size: 23px;
        }

        .message-meta {
          grid-template-columns: 42px minmax(0, 1fr);
        }

        .message-time {
          grid-column: 2;
          margin-top: -6px;
        }

        .result-grid,
        .skeleton-list {
          grid-template-columns: 1fr;
        }

        .result-row.wide {
          grid-column: auto;
        }

        .purchase-result-row {
          grid-template-columns: minmax(0, 1fr);
        }

        .purchase-result-row > .result-icon {
          display: none;
        }

        .extraction-card {
          padding: 17px;
        }

        .extraction-header {
          align-items: center;
        }

        .secondary-button .button-label {
          display: none;
        }

        .secondary-button {
          width: 38px;
          padding: 0;
        }

        .toast {
          right: 16px;
          bottom: 16px;
          left: 16px;
          width: auto;
          max-width: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <aside class="navigation" aria-label="邮件导航">
        <div class="brand">
          <div class="brand-copy">
            <div class="brand-title">OrderBridge</div>
            <div class="brand-subtitle">邮件智能订单处理系统</div>
          </div>
        </div>

        <nav class="nav-section" aria-label="邮箱文件夹">
          <button class="nav-item active" type="button" data-folder="inbox">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8.5 6.5 5h11L20 8.5V19H4Z"></path>
              <path d="M4 13h4l1.5 2h5l1.5-2h4"></path>
            </svg>
            <span class="nav-label">收件箱</span>
            <span class="nav-count" id="inbox-count">0</span>
          </button>
          <button class="nav-item" type="button" data-folder="starred">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"></path>
            </svg>
            <span class="nav-label">已标星</span>
            <span class="nav-count" id="starred-count">0</span>
          </button>
          <button class="nav-item" type="button" data-folder="unprocessed">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 7.5V12l3 2"></path>
            </svg>
            <span class="nav-label">未处理</span>
            <span class="nav-count" id="unprocessed-count">0</span>
          </button>
          <button class="nav-item" type="button" data-folder="processed">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="m8.5 12 2.3 2.3 4.8-5"></path>
            </svg>
            <span class="nav-label">已处理</span>
            <span class="nav-count" id="processed-count">0</span>
          </button>
          <button class="nav-item" type="button" data-folder="new">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="9.5" width="17" height="11" rx="2.5"></rect>
              <path d="m5.5 12 5.6 4.25a1.5 1.5 0 0 0 1.8 0l5.6-4.25"></path>
              <path d="M12 2.5v4M10 4.5h4"></path>
            </svg>
            <span class="nav-label">新增邮件</span>
            <span class="nav-count" id="new-count">0</span>
          </button>
        </nav>

        <nav class="nav-section" aria-label="业务类型">
          <h2 class="nav-heading">业务类型</h2>
          <button class="nav-item" type="button" data-label="BT1" title="BT1 · 首次询价、报价请求、产品规格及交期咨询">
            <span class="label-dot" style="--label-color: #e9a92f"></span>
            <span class="nav-label">BT1 · 初次询盘</span>
            <span class="nav-count" data-label-count="BT1">0</span>
          </button>
          <button class="nav-item" type="button" data-label="BT2" title="BT2 · 跟进报价、订单、交期、发货或回复进展">
            <span class="label-dot" style="--label-color: #35b980"></span>
            <span class="nav-label">BT2 · 追单邮件</span>
            <span class="nav-count" data-label-count="BT2">0</span>
          </button>
          <button class="nav-item" type="button" data-label="BT3" title="BT3 · 样品、寄样、试用、打样及评估申请">
            <span class="label-dot" style="--label-color: #4c9de7"></span>
            <span class="nav-label">BT3 · 样品申请</span>
            <span class="nav-count" data-label-count="BT3">0</span>
          </button>
          <button class="nav-item" type="button" data-label="BT4" title="BT4 · 质量异常、故障、损坏、错漏发及投诉反馈">
            <span class="label-dot" style="--label-color: #ee745d"></span>
            <span class="nav-label">BT4 · 投诉反馈</span>
            <span class="nav-count" data-label-count="BT4">0</span>
          </button>
          <button class="nav-item" type="button" data-label="BT5" title="BT5 · 代理、经销、渠道、供应商及项目合作咨询">
            <span class="label-dot" style="--label-color: #8c6ce4"></span>
            <span class="nav-label">BT5 · 合作咨询</span>
            <span class="nav-count" data-label-count="BT5">0</span>
          </button>
          <button class="nav-item" type="button" data-label="BT6" title="BT6 · 维修收据、服务确认、工作授权、发票及付款凭证">
            <span class="label-dot" style="--label-color: #2fa99f"></span>
